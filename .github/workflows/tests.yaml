name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-matrix:
    # single source of truth for approved Neovim versions: nysor/nvim_versions.py (also used by
    # the app itself at startup, see MainApp.setup_nvim) -- read here instead of duplicating the
    # list in this file, so they can never drift apart
    runs-on: ubuntu-24.04
    outputs:
      nvim-versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read approved Neovim versions
        id: versions
        run: |
          VERSIONS=$(python3 -c "
          import json
          from nysor.nvim_versions import TO_TEST
          print(json.dumps(TO_TEST))
          ")
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  run-tests:
    needs: generate-matrix
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.12", "3.13", "3.14"]
        nvim-version: ${{ fromJson(needs.generate-matrix.outputs.nvim-versions) }}

    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv

      # feeds the integration tests in tests/integration/, which skip themselves if this is not
      # set and nothing usable is found on PATH either (see tests/integration/conftest.py)
      - name: Install Neovim ${{ matrix.nvim-version }} (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -Lo /tmp/nvim.tar.gz "https://github.com/neovim/neovim/releases/download/v${{ matrix.nvim-version }}/nvim-linux-x86_64.tar.gz"
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "NYSOR_NVIM=/tmp/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"

      - name: Install project dependencies
        run: |
          pip install ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest

  tests-required:
    needs: run-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          # fail if any required test failed
