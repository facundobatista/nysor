name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.12", "3.13", "3.14"]
        nvim-version: ["0.12.2", "0.12.5"]

    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv

      # feeds the integration tests in tests/integration/, which skip themselves if this is not
      # set and nothing usable is found on PATH either (see tests/integration/conftest.py)
      - name: Install Neovim ${{ matrix.nvim-version }} (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -Lo /tmp/nvim.tar.gz "https://github.com/neovim/neovim/releases/download/v${{ matrix.nvim-version }}/nvim-linux-x86_64.tar.gz"
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "NYSOR_NVIM=/tmp/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"

      - name: Install project dependencies
        run: |
          pip install ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest
